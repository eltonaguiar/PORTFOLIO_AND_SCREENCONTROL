name: realtime-challenge

# Forward evidence generator for 03-trading-strategies/realtime_challenge.
#
#   forward-pod    hourly — mark live positions, enforce TP / SL / time-stop, open at
#                  most N new positions on the pre-registered book, commit the ledger.
#                  This is the thing that accumulates closed forward trades (n).
#   daily-refresh  06:20 UTC — re-run the backtest matrix + permutation control so the
#                  cost grid and deflated Sharpe stay current as the trial count grows.
#
# No API keys are needed: every price is a public exchange endpoint and no order is ever
# sent. To pause the forward pod, disable this workflow — the ledger is committed, so
# nothing is lost.

on:
  workflow_dispatch:
    inputs:
      book:
        description: "pod_a (pre-registered consensus) or none (supervise only)"
        default: "pod_a"
        type: choice
        options: [pod_a, none]
      max_new:
        description: "max positions to open in this pass"
        default: "1"
  schedule:
    - cron: "7 * * * *"      # forward pod, hourly
    - cron: "30 * * * *"     # carry series, hourly (offset from forward-pod :07)
    - cron: "20 6 * * *"     # daily backtest refresh
    - cron: "15 5 * * *"     # G-COST cost gates, daily (this exact cron gates the g-cost-gates job)

permissions:
  contents: write

concurrency:
  group: realtime-challenge
  cancel-in-progress: false

defaults:
  run:
    working-directory: 03-trading-strategies

jobs:
  forward-pod:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install ccxt==4.5.38 pandas numpy

      - name: Supervise open positions (TP / SL / time stop) and open new ones
        env:
          BOOK: ${{ github.event.inputs.book || 'pod_a' }}
          MAX_NEW: ${{ github.event.inputs.max_new || '1' }}
        run: |
          python -m realtime_challenge.worker.forward_supervisor \
            --book "$BOOK" --run-id pod_a_crypto_1h --venue bybit \
            --max-open 4 --max-new "$MAX_NEW" --min-votes 2

      - name: Commit ledger
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "realtime-challenge-bot"
          git config user.email "realtime-challenge@users.noreply.github.com"
          git add 03-trading-strategies/realtime_challenge/state \
                  03-trading-strategies/results 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state change this pass"
            exit 0
          fi
          git commit -m "rtc: forward pod pass $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1

  carry-series:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install ccxt==4.5.38

      - name: Measure one carry tick across the majors
        run: python -m realtime_challenge.proof.carry_roundtrip

      - name: Recompute running median + n
        run: python -m realtime_challenge.proof.carry_series

      - name: Commit series + summary
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "realtime-challenge-bot"
          git config user.email "realtime-challenge@users.noreply.github.com"
          git add 03-trading-strategies/results/carry_roundtrip.jsonl 03-trading-strategies/results/carry_series_summary.json
          if git diff --cached --quiet; then
            echo "no series change this pass"
            exit 0
          fi
          git commit -m "rtc: carry series tick $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1

  daily-refresh:
    if: github.event_name == 'schedule' && github.event.schedule == '20 6 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install ccxt==4.5.38 pandas numpy scipy

      - name: Certify the harness before trusting any number
        run: python -m realtime_challenge.proof.test_harness

      - name: Backtest matrix + permutation control
        run: |
          python -m realtime_challenge.cli backtest \
            --venue binance --timeframe 1h --bars 3000 --permutations 200 --verbose

      - name: Commit results
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "realtime-challenge-bot"
          git config user.email "realtime-challenge@users.noreply.github.com"
          git add 03-trading-strategies/results 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no result change"
            exit 0
          fi
          git commit -m "rtc: backtest refresh $(date -u +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || true
            sleep 3
          done
          exit 1

  bracket-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '45 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the bracket gate unattended (evaluate + exit-mix test)
        working-directory: 03-trading-strategies
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from realtime_challenge.bracket import evaluate, exit_mix_test

          # Live probe bracket from the P7 audit: BTC 59,700, 1h ATR 426,
          # tp 0.9xATR / sl 0.55xATR, 3-bar hold. The gate must refuse it.
          probe = evaluate(59700.0, 426.0, tp_atr=0.9, sl_atr=0.55, hold_bars=3)
          assert not probe.fail_reach, "barriers are inside the expected excursion"
          assert probe.fail_ev, "probe bracket is negative-EV at its own implied probabilities"

          # Follow-up: 0 of 27 take-profits against a geometry-implied ~34% TP exit rate.
          em = exit_mix_test(probe.p_tp_exit, n_tp=0, n_total=27)
          assert em["p_value_two_sided"] < 0.001, "0/27 incompatible with bracket geometry"
          assert "driftless assumption is violated" in em["verdict"], em["verdict"]

          report = {
            "generated_utc": datetime.now(timezone.utc).isoformat(),
            "gate": "bracket-gate",
            "probe_bracket": {"price": 59700.0, "atr": 426.0, "tp_atr": 0.9, "sl_atr": 0.55, "hold_bars": 3},
            "evaluate": probe.as_dict(),
            "exit_mix_test": em,
            "verdict": "REFUSE — bracket cannot pay at the win rate its own geometry implies; 0/27 TPs is incompatible with the driftless walk (direction problem, not a bracket problem)",
          }
          Path("results").mkdir(parents=True, exist_ok=True)
          Path("results/bracket_gate_latest.json").write_text(json.dumps(report, indent=1) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=1))
          PY

      - name: Commit gate verdict
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "realtime-challenge-bot"
          git config user.email "realtime-challenge@users.noreply.github.com"
          git add 03-trading-strategies/results/bracket_gate_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no gate change this pass"
            exit 0
          fi
          git commit -m "rtc: bracket gate unattended run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1

  g-cost-gates:
    # Cost-model validation gates (NEXT_STEPS.md Q4). Runs on a schedule and on
    # dispatch; fails the job when any gate KILLs a cost assumption, and always
    # commits the measured verdict so a red run leaves evidence on main.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install ccxt pandas numpy

      - name: Run the G-COST cost gates
        id: gates
        continue-on-error: true
        working-directory: 03-trading-strategies
        run: |
          python -m realtime_challenge.proof.g_cost_gates > /tmp/g_cost_gates_run.log 2>&1 || rc=$?
          echo "GATES_EXIT=${rc:-0}" >> $GITHUB_ENV
          cat /tmp/g_cost_gates_run.log

      - name: Commit gate results (always, so a KILL leaves evidence)
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "realtime-challenge-bot"
          git config user.email "realtime-challenge@users.noreply.github.com"
          git add 03-trading-strategies/realtime_challenge/results/g_cost_gates_latest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no gate change this pass"
            exit 0
          fi
          git commit -m "rtc: G-COST gates run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1

      - name: Fail the job if any gate KILLs
        if: env.GATES_EXIT != '0'
        run: |
          echo "A G-COST gate KILLED a cost assumption — see 03-trading-strategies/realtime_challenge/results/g_cost_gates_latest.json" >&2
          exit 1
